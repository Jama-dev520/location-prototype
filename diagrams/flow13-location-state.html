ystem,"Segoe UI",system-ui,sans-serif'>exactly one live source</text><text x="632" y="232" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>baseline captured at</text><text x="632" y="247" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>sign-off</text><rect x="884" y="152" width="186" height="108" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><rect x="884" y="152" width="4" height="108" rx="2" fill="#475569"/><text x="900" y="179" font-size="14" fill="#475569" font-weight="650" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Offline</text><text x="900" y="202" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>switched off by a person</text><text x="900" y="217" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>or the source went inactive</text><text x="900" y="232" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>both effective immediately</text><rect x="1152" y="152" width="186" height="108" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1152" y="152" width="4" height="108" rx="2" fill="#64748B"/><text x="1168" y="179" font-size="14" fill="#64748B" font-weight="650" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Retired</text><text x="1168" y="202" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>merged away</text><text x="1168" y="217" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>merged_into points</text><text x="1168" y="232" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>at the keeper</text><path d="M266 206.0 H345" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="343" y="192.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>OC generated</text><text x="343" y="203.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>(off)</text><path d="M534 206.0 H613" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="611" y="198.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>sign-off</text><path d="M802 206.0 H881" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="879" y="192.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>switch</text><text x="879" y="203.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>off</text><path d="M924 260 C924 300 709.0 300 709.0 263" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="894" y="306" font-size="10.2" fill="#475569" font-weight="500" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>sign-off again</text><path d="M709.0 152 C709.0 100 1245.0 100 1245.0 149" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="977.0" y="94" font-size="10.2" fill="#475569" font-weight="500" text-anchor="middle" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>merged away</text><path d="M1070 206.0 H1149" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="1147" y="192.0" inked to a live store,</text><text x="364" y="535" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>not feeding it</text><text x="364" y="550" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>no baseline of its own</text><rect x="616" y="470" width="186" height="108" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/><rect x="616" y="470" width="4" height="108" rx="2" fill="#047857"/><text x="632" y="497" font-size="14" fill="#047857" font-weight="650" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Live source</text><text x="790" y="496" font-size="9.5" fill="#047857" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>at most 1</text><text x="632" y="520" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>the record this store</text><text x="632" y="535" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>reads. One per store</text><rect x="884" y="470" width="186" height="108" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2"/><rect x="884" y="470" width="4" height="108" rx="2" fill="#C2410C"/><text x="900" y="497" font-size="14" fill="#C2410C" font-weight="650" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Withdrawn</text><text x="900" y="520" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>merged_into</text><text x="900" y="535" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>comes back if the</text><text x="900" y="550" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>keeper leaves the OC</text><rect x="1152" y="470" width="186" height="108" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><rect x="1152" y="470" width="4" height="108" rx="2" fill="#64748B"/><text x="1168" y="497" font-size="14" fill="#64748B" font-weight="650" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Removed</text><text x="1168" y="520" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>delisted by</text><text x="1168" y="535" font-size="10.9" fill="#64748B" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>the provider</text><path d="M266 524.0 H345" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="343" y="510.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>joins a</text><text x="343" y="521.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>live store</text><path d="M534 524.0 H613" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="611" y="510.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>switch +</text><text x="611" y="521.0" font-size="9.4" fill="#475569" font-weight="600" text-anchor="end" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>sign-off</text><path d="M173.0 578 C173.0 622 977.0 622 977.0 581" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="560" y="644" font-size="10.2" fill="#475569" font-weight="500" text-anchor="middle" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>same station: one record is withdrawn, the keeper stays</text><path d="M1245.0 424 V467" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah)"/><text x="1245.0" y="418" font-size="10.2" fill="#475569" font-weight="500" text-anchor="middle" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>provider delists it (any state)</text><path d="M709.0 466 V263" fill="none" stroke="#047857" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="725.0" y="336" font-size="11.5" fill="#047857" font-weight="650" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>the store reads from this record</text><text x="725.0" y="354" font-size="10.6" fill="#047857" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>sign-off names the source and takes the store live —</text><text x="725.0" y="370" font-size="10.6" fill="#047857" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>one action, both rows move</text><text x="48" y="690" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>A pending pair is not a state either: the record sits in Candidate with no OC, so there is nothing to sign off and nothing downstream.</text><text x="48" y="712" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Blocked is not a state: a failed check leaves the store exactly where it was — Not live.</text><text x="48" y="734" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Going down is one click; coming up is a check. That asymmetry is the design, not an oversight.</text><text x="48" y="756" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family='-apple-system,"Segoe UI",system-ui,sans-serif'>Retired is terminal for the OC location; Removed is terminal for the record. Neither id is ever reused.</text></svg></body></html>
